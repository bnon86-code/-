<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نداء الطالبات — المتوسطة الأولى والثانية بالخبر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#07452C;
    --green-700:#0B5D3B;
    --green-500:#12805A;
    --gold:#C9A227;
    --gold-soft:#E8D9A0;
    --paper:#F5F2E9;
    --paper-2:#FBFAF5;
    --ink:#17201B;
    --ink-60:#5A6660;
    --line:rgba(11,93,59,.18);
    --radius:14px;
    --font:"Tajawal","Tahoma",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none}
  input,select{font-family:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px}

  /* ===== الواجهة الأولى ===== */
  .gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    background:
      radial-gradient(120% 70% at 50% 0%, #0E6B44 0%, var(--green-900) 70%);
    color:#fff;padding:32px 20px}
  .crest{width:56px;height:56px;margin:0 auto 20px;border:2px solid var(--gold);
    border-radius:50%;display:grid;place-items:center;font-size:24px;color:var(--gold)}
  .gate h1{font-size:clamp(26px,7vw,38px);font-weight:800;text-align:center;line-height:1.35}
  .gate .sub{text-align:center;color:var(--gold-soft);margin-top:10px;font-size:15px;line-height:1.9}
  .doors{display:grid;gap:14px;margin:34px auto 0;max-width:420px;width:100%}
  .door{background:rgba(255,255,255,.06);border:1px solid rgba(233,217,160,.35);
    border-radius:var(--radius);padding:20px 18px;text-align:right;color:#fff;
    display:flex;align-items:center;gap:14px;transition:background .18s,border-color .18s}
  .door:hover,.door:focus-visible{background:rgba(255,255,255,.12);border-color:var(--gold)}
  .door .ic{font-size:26px}
  .door b{display:block;font-size:18px;font-weight:700}
  .door span{font-size:13px;color:var(--gold-soft)}

  /* ===== رأس الصفحات ===== */
  .bar{background:var(--green-700);color:#fff;padding:14px 18px;display:flex;
    align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:9}
  .bar h2{font-size:17px;font-weight:700}
  .bar small{display:block;font-size:12px;color:var(--gold-soft);font-weight:400}
  .back{background:transparent;color:var(--gold-soft);font-size:14px;padding:8px}

  /* ===== نموذج ولي الأمر ===== */
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:500;margin-bottom:7px;color:var(--ink)}
  .field input,.field select{width:100%;padding:14px 14px;font-size:16px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus{outline:2px solid var(--green-500);outline-offset:1px;border-color:transparent}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .send{width:100%;background:var(--green-700);color:#fff;font-size:18px;font-weight:700;
    padding:17px;border-radius:12px;margin-top:6px;transition:background .18s}
  .send:hover{background:var(--green-500)}
  .send:disabled{opacity:.55;cursor:not-allowed}
  .hint{font-size:13px;color:var(--ink-60);line-height:1.9;margin-top:14px;text-align:center}
  .err{color:#9B2226;font-size:14px;margin-top:10px;text-align:center;min-height:20px}

  .done{text-align:center;padding:36px 20px}
  .done .tick{width:74px;height:74px;margin:0 auto 20px;border-radius:50%;background:var(--green-700);
    color:#fff;display:grid;place-items:center;font-size:36px}
  .done h3{font-size:24px;font-weight:800;margin-bottom:10px}
  .done p{color:var(--ink-60);line-height:2;font-size:15px}
  .done .name{font-size:28px;font-weight:800;color:var(--green-700);margin:16px 0}
  .again{margin-top:26px;background:transparent;color:var(--green-700);border:1px solid var(--line);
    padding:13px 26px;border-radius:10px;font-size:15px;font-weight:500}

  /* ===== شاشة المدرسة ===== */
  .screen{min-height:100vh;background:var(--green-900);color:#fff;padding:0 0 40px}
  .screen-top{display:flex;justify-content:space-between;align-items:center;
    padding:18px 26px;border-bottom:1px solid rgba(233,217,160,.25)}
  .screen-top h2{font-size:20px;font-weight:700}
  .screen-top .clock{font-size:20px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  .calls{padding:22px 20px;display:grid;gap:14px;max-width:1100px;margin:0 auto}
  .call{background:#fff;color:var(--ink);border-radius:16px;padding:20px 22px;
    display:flex;align-items:center;gap:18px;border-right:8px solid var(--gold)}
  .call.fresh{animation:pop .5s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .call .n{font-size:clamp(26px,5.5vw,44px);font-weight:800;line-height:1.3;flex:1}
  .call .meta{font-size:15px;color:var(--ink-60);margin-top:6px;font-weight:400}
  .ok{background:var(--green-700);color:#fff;padding:14px 18px;border-radius:10px;
    font-size:15px;font-weight:700;white-space:nowrap}
  .empty{text-align:center;padding:70px 24px;color:var(--gold-soft)}
  .empty div:first-child{font-size:46px;margin-bottom:16px;opacity:.6}
  .empty p{font-size:18px;line-height:2}
  .screen-foot{text-align:center;padding:14px;color:rgba(255,255,255,.5);font-size:13px}
  .tools{display:flex;gap:10px;justify-content:center;padding:0 20px}
  .tool{background:transparent;color:var(--gold-soft);border:1px solid rgba(233,217,160,.3);
    padding:10px 16px;border-radius:9px;font-size:13px}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ========== 1. الاختيار ========== -->
<section id="gate" class="gate">
  <div class="crest">✦</div>
  <h1>نداء الطالبات</h1>
  <p class="sub">المتوسطة الأولى والثانية بالخبر<br>الإدارة العامة للتعليم بالمنطقة الشرقية</p>
  <div class="doors">
    <button class="door" onclick="go('parent')">
      <span class="ic">📱</span>
      <span><b>ولي الأمر</b><span>اكتبي اسم الطالبة ليصل النداء للمدرسة</span></span>
    </button>
    <button class="door" onclick="go('screen')">
      <span class="ic">🖥️</span>
      <span><b>شاشة المدرسة</b><span>عرض أسماء الطالبات المطلوبات</span></span>
    </button>
  </div>
</section>

<!-- ========== 2. ولي الأمر ========== -->
<section id="parent" class="hidden">
  <div class="bar">
    <div><h2>نداء طالبة<small>يصل الاسم مباشرة إلى شاشة المدرسة</small></h2></div>
    <button class="back" onclick="go('gate')">رجوع</button>
  </div>
  <div class="wrap">
    <div id="form-card" class="card">
      <div class="field">
        <label for="sName">اسم الطالبة</label>
        <input id="sName" type="text" placeholder="الاسم الثلاثي" autocomplete="off">
      </div>
      <div class="row">
        <div class="field">
          <label for="sGrade">المرحلة</label>
          <select id="sGrade">
            <option value="">اختاري</option>
            <option>أول متوسط</option>
            <option>ثاني متوسط</option>
            <option>ثالث متوسط</option>
          </select>
        </div>
        <div class="field">
          <label for="sClass">الصف</label>
          <select id="sClass">
            <option value="">اختاري</option>
            <option>١</option><option>٢</option><option>٣</option>
            <option>٤</option><option>٥</option><option>٦</option>
          </select>
        </div>
      </div>
      <button id="sendBtn" class="send" onclick="sendCall()">إرسال النداء</button>
      <div id="err" class="err"></div>
      <p class="hint">النداء يصل خلال ثوانٍ. يُرجى الانتظار عند بوابة المدرسة.</p>
    </div>

    <div id="done-card" class="done card hidden">
      <div class="tick">✓</div>
      <h3>وصل النداء</h3>
      <div class="name" id="doneName"></div>
      <p id="doneMsg"></p>
      <button class="again" onclick="resetForm()">نداء طالبة أخرى</button>
    </div>
  </div>
</section>

<!-- ========== 3. الشاشة ========== -->
<section id="screen" class="screen hidden">
  <div class="screen-top">
    <h2>الطالبات المطلوبات للخروج</h2>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div id="calls" class="calls"></div>
  <div class="tools">
    <button class="tool" onclick="clearAll()">مسح جميع النداءات</button>
    <button class="tool" onclick="go('gate')">رجوع</button>
  </div>
  <p class="screen-foot" id="foot"></p>
</section>

<script>
const KEY = 'nedaa:queue';
let view = 'gate', timer = null, seen = new Set(), soundOn = false;

/* ---------- التنقل ---------- */
function go(v){
  view = v;
  ['gate','parent','screen'].forEach(id=>
    document.getElementById(id).classList.toggle('hidden', id!==v));
  clearInterval(timer);
  if(v==='screen'){ soundOn = true; renderScreen(); timer = setInterval(renderScreen, 3000); tick(); }
  window.scrollTo(0,0);
}

/* ---------- التخزين ---------- */
async function readQueue(){
  try{
    const r = await window.storage.get(KEY, true);
    const list = r ? JSON.parse(r.value) : [];
    const today = new Date().toDateString();
    return list.filter(c => new Date(c.at).toDateString() === today);
  }catch(e){ return []; }
}
async function writeQueue(list){
  await window.storage.set(KEY, JSON.stringify(list), true);
}

/* ---------- الإرسال ---------- */
async function sendCall(){
  const name = document.getElementById('sName').value.trim();
  const grade = document.getElementById('sGrade').value;
  const cls = document.getElementById('sClass').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('sendBtn');

  if(name.length < 3){ err.textContent = 'اكتبي اسم الطالبة كاملاً'; return; }
  if(!grade || !cls){ err.textContent = 'اختاري المرحلة والصف'; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';

  try{
    const list = await readQueue();
    list.push({
      id: 'c' + Date.now() + Math.floor(Math.random()*999),
      name, grade, cls, at: new Date().toISOString()
    });
    await writeQueue(list);
    document.getElementById('doneName').textContent = name;
    document.getElementById('doneMsg').textContent =
      `${grade} / ${cls} — تم تنبيه المدرسة، وسيتم إخراج الطالبة بعد التحقق من الهوية.`;
    document.getElementById('form-card').classList.add('hidden');
    document.getElementById('done-card').classList.remove('hidden');
  }catch(e){
    err.textContent = 'تعذّر الإرسال. تحققي من الاتصال وأعيدي المحاولة.';
  }
  btn.disabled = false; btn.textContent = 'إرسال النداء';
}

function resetForm(){
  document.getElementById('sName').value='';
  document.getElementById('sGrade').value='';
  document.getElementById('sClass').value='';
  document.getElementById('done-card').classList.add('hidden');
  document.getElementById('form-card').classList.remove('hidden');
}

/* ---------- الشاشة ---------- */
async function renderScreen(){
  const list = (await readQueue()).sort((a,b)=> new Date(b.at)-new Date(a.at));
  const box = document.getElementById('calls');

  if(!list.length){
    box.innerHTML = `<div class="empty"><div>🔔</div><p>لا توجد نداءات حالياً<br>ستظهر أسماء الطالبات هنا فور وصول النداء</p></div>`;
    document.getElementById('foot').textContent = '';
    return;
  }

  let isNew = false;
  box.innerHTML = list.map(c=>{
    const fresh = !seen.has(c.id);
    if(fresh){ seen.add(c.id); isNew = true; }
    const t = new Date(c.at).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
    return `<div class="call ${fresh?'fresh':''}">
      <div><div class="n">${esc(c.name)}</div>
      <div class="meta">${esc(c.grade)} — الصف ${esc(c.cls)} • ${t}</div></div>
      <button class="ok" onclick="removeCall('${c.id}')">خرجت الطالبة</button>
    </div>`;
  }).join('');

  document.getElementById('foot').textContent = `عدد النداءات اليوم: ${list.length}`;
  if(isNew && soundOn) beep();
}

async function removeCall(id){
  const list = (await readQueue()).filter(c=>c.id!==id);
  await writeQueue(list);
  renderScreen();
}
async function clearAll(){
  if(!confirm('مسح جميع النداءات من الشاشة؟')) return;
  await writeQueue([]); seen.clear(); renderScreen();
}

/* ---------- أدوات ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tick(){
  const c = document.getElementById('clock');
  const upd = ()=> c.textContent = new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
  upd(); setInterval(upd, 20000);
}
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [880,1175].forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type='sine'; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i*0.22);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i*0.22 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.22 + 0.2);
      o.start(ctx.currentTime + i*0.22); o.stop(ctx.currentTime + i*0.22 + 0.25);
    });
  }catch(e){}
}
</script>
</body>
</html>
